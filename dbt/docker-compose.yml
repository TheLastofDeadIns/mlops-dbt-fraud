# ClickHouse для локального запуска, если сервер из домашки по ClickHouse не поднят
services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    container_name: fraud-dbt-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      # пользователь default без пароля с доступом по сети, только для учебного стенда
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      TZ: UTC
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  clickhouse_data:
